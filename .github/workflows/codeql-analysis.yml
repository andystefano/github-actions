name: "CodeQL and Security Scan"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Enable verbose output for better debugging
          verbose: true
          # Fail on leaks found
          fail-on: true
          # Additional configuration for better secret detection
          additional-args: >
            --config-path=.github/gitleaks-config.toml
            --report-format=json
            --report-path=gitleaks-report.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  check-env-files:
    name: Check for .env files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for .env files
        run: |
          echo "🔍 Checking for .env files and potential secrets..."
          
          # Check for .env files
          if find . -name "*.env*" -type f | grep -q .; then
            echo "❌ Found .env files:"
            find . -name "*.env*" -type f
            echo "::error::Found .env files in repository. These should not be committed."
            exit 1
          else
            echo "✅ No .env files found"
          fi
          
          # Check for files that might contain secrets
          if find . -name "*.key" -o -name "*.pem" -o -name "*.p12" -o -name "*.pfx" -o -name "id_rsa" -o -name "id_dsa" -o -name "id_ecdsa" -o -name "id_ed25519" | grep -q .; then
            echo "❌ Found potential key files:"
            find . -name "*.key" -o -name "*.pem" -o -name "*.p12" -o -name "*.pfx" -o -name "id_rsa" -o -name "id_dsa" -o -name "id_ecdsa" -o -name "id_ed25519"
            echo "::error::Found potential key files in repository. These should not be committed."
            exit 1
          else
            echo "✅ No key files found"
          fi
          
          # Check for hardcoded secrets in code
          echo "🔍 Scanning for potential hardcoded secrets..."
          if grep -r -i -E "(password|secret|key|token|api_key|apikey|access_token|private_key)" --include="*.js" --include="*.php" --include="*.py" --include="*.java" --include="*.ts" --include="*.jsx" --include="*.tsx" . | grep -v "node_modules" | grep -v ".git" | grep -v "package-lock.json" | grep -v "yarn.lock" | grep -E "['\"][a-zA-Z0-9]{20,}['\"]" | head -10; then
            echo "⚠️  Potential hardcoded secrets found. Please review the above matches."
            echo "::warning::Potential hardcoded secrets found in code. Please review."
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in the config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: security-extended,security-and-quality

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # ℹ️ Command-line programs to run using the OS shell.
    #   📚 https://git.io/JvXlR

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language
    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
