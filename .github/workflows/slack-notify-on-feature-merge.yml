name: Notificar a Slack cuando se cierra feature a develop

on:
  push:
    branches:
      - develop

jobs:
  notify-slack:
    runs-on: ubuntu-latest
     steps:
      - name: Notificar a Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          curl --fail -X POST -H 'Content-type: application/json' --data "{
            \"text\": \"🚀 Se hizo *push* a la rama *develop* en la app *${APP_NAME}*.\"
          }" $SLACK_WEBHOOK_URL
