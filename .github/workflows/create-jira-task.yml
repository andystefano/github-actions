name: Create Jira Issue on New Branch

on:
  push:
    branches:
      - '**'

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    if: github.event.before == '0000000000000000000000000000000000000000'

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Get branch name
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Get first commit message
        id: get_commit
        run: |
          FIRST_COMMIT_MSG=$(git log --reverse --pretty=format:%s | head -n 1)
          echo "commit_msg=$FIRST_COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Create Jira issue
        id: create_issue
        run: |
          SUMMARY="${{ steps.get_commit.outputs.commit_msg }}"
          DESCRIPTION="Tarea creada automáticamente desde la rama '$BRANCH_NAME'"

          RESPONSE=$(curl -s -X POST \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --url "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue" \
            -d @- <<EOF
{
  "fields": {
    "project": {
      "key": "${{ secrets.JIRA_PROJECT_KEY }}"
    },
    "summary": "$SUMMARY",
    "description": "$DESCRIPTION",
    "customfield_10037": "$BRANCH_NAME",
    "issuetype": {
      "name": "Task"
    }
  }
}
EOF
          )

          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          ISSUE_KEY=$(echo "$RESPONSE" | jq -r '.key')
          echo "Created Jira issue: $ISSUE_KEY"
          echo "ISSUE_KEY=$ISSUE_KEY" >> $GITHUB_ENV
