name: Jira Task Creator

on:
  # Trigger manual desde la UI de GitHub
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Nombre completo de la rama (ej: feature/login)'
        required: true
        type: string
      issue_title:
        description: 'Título para la tarea en Jira'
        required: true
        type: string
      issue_description:
        description: 'Descripción detallada (opcional)'
        required: false
        type: string
        default: 'Tarea creada automáticamente desde GitHub'

  # Trigger automático al crear ramas feature/*
  push:
    branches:
      - 'feature/*'

jobs:
  create-jira-task:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Determinar el modo de ejecución (manual/automático)
      - name: Set execution mode
        id: set-mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "MODO=MANUAL" >> $GITHUB_ENV
            echo "BRANCH=${{ github.event.inputs.branch_name }}" >> $GITHUB_ENV
            echo "TITLE=${{ github.event.inputs.issue_title }}" >> $GITHUB_ENV
            echo "DESC=${{ github.event.inputs.issue_description }}" >> $GITHUB_ENV
          else
            echo "MODO=AUTO" >> $GITHUB_ENV
            echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "TITLE=Desarrollo para rama: ${{ github.ref_name }}" >> $GITHUB_ENV
            echo "DESC=Tarea creada automáticamente para la rama ${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      # Paso 2: Crear la tarea en Jira
      - name: Create Jira issue
        env:
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
        run: |
          echo "Creando tarea en Jira..."
          echo "Modo: $MODO"
          echo "Proyecto: $JIRA_PROJECT_KEY"
          
          RESPONSE=$(curl -s -X POST \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "fields": {
                "project": { "key": "'"$JIRA_PROJECT_KEY"'" },
                "summary": "'"$TITLE"'",
                "description": "'"$DESC"'",
                "issuetype": { "name": "Task" },
                "labels": ["github-automation"]
              }
            }' \
            "$JIRA_BASE_URL/rest/api/2/issue/")

          # Mostrar resultado
          echo "$RESPONSE" | jq .
          
          # Extraer y mostrar clave de la tarea
          ISSUE_KEY=$(echo "$RESPONSE" | jq -r '.key')
          echo "Tarea creada: $ISSUE_KEY"
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT

      # Paso 3 (Opcional): Notificación de resultado
      - name: Show result
        run: |
          echo "✔️ Proceso completado"
          echo "Modo de ejecución: $MODO"
          echo "Tarea Jira creada: ${{ steps.create-jira-task.outputs.issue_key }}"
          echo "URL: ${{ vars.JIRA_BASE_URL }}/browse/${{ steps.create-jira-task.outputs.issue_key }}"