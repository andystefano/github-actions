name: Create Jira Issue on New Branch

on:
  create:
    branches: '**'  # Se activa al crear cualquier rama
  push:
    branches-ignore:
      - 'main'      # Ignora ramas principales
      - 'master'
      - 'develop'

jobs:
  create-jira-task:
    runs-on: ubuntu-latest
    steps:
      - name: Check if branch is new
        id: check-branch
        uses: actions/github-script@v6
        with:
          script: |
            const branchName = context.ref.replace('refs/heads/', '');
            const response = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const branchExists = response.data.some(branch => branch.name === branchName);
            return branchExists ? 'existing' : 'new';

      - name: Create Jira Issue (only for new branches)
        if: steps.check-branch.outputs.result == 'new'
        env:
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Creando tarea en Jira para la rama: $BRANCH_NAME"
          
          # Configuración del payload para Jira
          JSON_PAYLOAD=$(cat <<EOF
          {
            "fields": {
              "project": { "key": "$JIRA_PROJECT_KEY" },
              "summary": "Desarrollo para rama: $BRANCH_NAME",
              "description": "Rama creada en GitHub:\\n\\n- **Repositorio**: ${{ github.repository }}\\n- **Autor**: ${{ github.actor }}\\n- **Enlace**: https://github.com/${{ github.repository }}/tree/$BRANCH_NAME",
              "issuetype": { "name": "Task" },
              "labels": ["github-automation"]
            }
          }
          EOF
          )

          # Llamada a la API de Jira
          curl -X POST \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$JSON_PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/2/issue/" \
            && echo "Tarea creada exitosamente en Jira!" \
            || echo "Error al crear la tarea en Jira"