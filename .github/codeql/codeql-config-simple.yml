name: "CodeQL Simple Config"

# Configuración simple que funciona con las consultas estándar de CodeQL
queries:
  # Incluir todas las consultas de seguridad estándar
  - uses: security-and-quality

# Configuración de paths
paths:
  - "**/*.js"
  - "**/*.ts"
  - "**/*.json"
  - "**/*.yml"
  - "**/*.yaml"

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.github/**"
