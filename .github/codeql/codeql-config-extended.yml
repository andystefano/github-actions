name: "CodeQL Extended Config"

# Configuración extendida para detectar archivos .env y otras vulnerabilidades
queries:
  # Consultas de seguridad estándar
  - uses: security-and-quality
  
  # Consultas adicionales de seguridad
  - uses: security-extended

# Configuración de paths
paths:
  - "**/*.js"
  - "**/*.ts"
  - "**/*.json"
  - "**/*.yml"
  - "**/*.yaml"

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.github/**"

# Filtros de consultas
query-filters:
  - include:
      tags contain: security
  - include:
      tags contain: external-file
  - include:
      tags contain: environment
  - include:
      tags contain: hardcoded-credentials
  - include:
      tags contain: configuration
