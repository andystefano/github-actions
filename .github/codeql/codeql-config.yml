name: "CodeQL Config"

# Configuración para análisis de seguridad (detección de archivos .env removida)
queries:
  # Incluir consultas de seguridad estándar que detectan:
  # - Variables de entorno hardcodeadas
  # - Secretos en código
  - uses: security-and-quality

# Configuración de paths para incluir/excluir
paths:
  - "**/*.js"
  - "**/*.ts"
  - "**/*.json"
  - "**/*.yml"
  - "**/*.yaml"

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.github/**"

# Filtros para incluir consultas relevantes
query-filters:
  - include:
      tags contain: security
  - include:
      tags contain: hardcoded-credentials
