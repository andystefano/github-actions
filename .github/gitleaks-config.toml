# Gitleaks configuration for enhanced secret detection
title = "Gitleaks Security Scan Configuration"

# Enable verbose output
verbose = true

# Output format
report-format = "json"

# Custom rules for .env files and secrets
[[rules]]
id = "env-file"
description = "Environment file detected"
regex = '''\.env(?:\.(?:local|development|production|test|staging))?$'''
tags = ["env", "file", "secret"]

[[rules]]
id = "env-variable"
description = "Environment variable pattern"
regex = '''[A-Z_][A-Z0-9_]*\s*=\s*['"][^'"]+['"]'''
tags = ["env", "variable", "secret"]

[[rules]]
id = "api-key"
description = "API Key pattern"
regex = '''(?i)(api[_-]?key|apikey|access[_-]?token|private[_-]?key)\s*[=:]\s*['"][a-zA-Z0-9]{20,}['"]'''
tags = ["api", "key", "secret"]

[[rules]]
id = "database-url"
description = "Database connection string"
regex = '''(?i)(mysql|postgresql|mongodb|redis)://[a-zA-Z0-9._-]+:[a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+:[0-9]+/[a-zA-Z0-9._-]+'''
tags = ["database", "url", "secret"]

[[rules]]
id = "jwt-token"
description = "JWT Token pattern"
regex = '''eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*'''
tags = ["jwt", "token", "secret"]

[[rules]]
id = "aws-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "access-key", "secret"]

[[rules]]
id = "aws-secret"
description = "AWS Secret Access Key"
regex = '''[0-9a-zA-Z/+]{40}'''
tags = ["aws", "secret-key", "secret"]

[[rules]]
id = "private-key"
description = "Private Key file"
regex = '''-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'''
tags = ["private-key", "secret"]

# Exclude patterns
[[rules.exclude]]
description = "Exclude test files"
regex = '''test|spec|example'''
